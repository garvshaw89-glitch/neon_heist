<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brutalist Outer Chassis -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Chamfer Highlight -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Tactical Crosshair Grid Ticks -->
  <line x1="32" y1="6" x2="32" y2="14" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="58" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="14" y2="32" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="58" y2="32" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>

  <!-- Outer Hexagonal Reticle -->
  <polygon points="32,16 46,24 46,40 32,48 18,40 18,24" fill="none" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Ghost Infiltrator Core Emblem -->
  <path d="M 22 28 L 32 18 L 42 28 L 38 42 L 32 46 L 26 42 Z" fill="#040812" stroke="url(#cyan-glow)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Precision Center Eye / Target Node -->
  <circle cx="32" cy="32" r="3.5" fill="#38bdf8"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>
  
  <!-- Corner Technical Markers -->
  <rect x="8" y="8" width="3" height="3" fill="#38bdf8" opacity="0.6"/>
  <rect x="53" y="8" width="3" height="3" fill="#38bdf8" opacity="0.6"/>
  <rect x="8" y="53" width="3" height="3" fill="#38bdf8" opacity="0.6"/>
  <rect x="53" y="53" width="3" height="3" fill="#38bdf8" opacity="0.6"/>
</svg>
